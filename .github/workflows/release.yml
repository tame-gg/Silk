name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure git identity
        run: git config --global user.email "actions@github.com" && git config --global user.name "GitHub Actions"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Build release artifacts
        run: ./gradlew build :silkmc-server:createPaperclipJar --stacktrace

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for kind in paperclip bundler server; do
            jars=(silkmc-server/build/libs/silkmc-${kind}-*.jar)
            [ "${#jars[@]}" -eq 1 ] || { echo "expected one ${kind} jar, found: ${jars[*]}"; exit 1; }
            cp "${jars[0]}" "release/silk-${kind}-${GITHUB_REF_NAME}.jar"
          done
          zip -qr "release/silk-patches-${GITHUB_REF_NAME}.zip" \
            silkmc-api/paper-patches silkmc-api/build.gradle.kts.patch \
            silkmc-server/minecraft-patches silkmc-server/paper-patches silkmc-server/build.gradle.kts.patch
          ls -l release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: docs/releases/${{ github.ref_name }}.md
